<section class="landing">
  <div class="wrapper">
    <div class="bg">
      <picture>
        <source
          media="(min-width:800px)"
          [srcset]="
            sanitizeImageUrl(
              '../../../../assets/Images/Home/Landing/1280/Digitalbyrå-i-oslo-Moderna-Media-for-grafisk-design-logo-design-og-web-design-hjemmeside-for-bedrift.webp'
            )
          "
        />
        <source
          media="(min-width:0px)"
          [srcset]="
            sanitizeImageUrl(
              '../../../../assets/Images/Home/Landing/640/Digitalbyrå-i-oslo-Moderna-Media-for-grafisk-design-logo-design-og-web-design-hjemmeside-for-bedrift.webp'
            )
          "
        />
        <img
          [src]="
            sanitizeImageUrl(
              '../../../../assets/Images/Home/Landing/1280/Digitalbyrå-i-oslo-Moderna-Media-for-grafisk-design-logo-design-og-web-design-hjemmeside-for-bedrift.webp'
            )
          "
          alt="Moderna media Digitalbyrå for bedriftens nettsider, programvare, grafisk design og søkemotoroptimalisering"
          class="landing-image"
        />
      </picture>
      <div class="bg-shade"></div>
    </div>
    <div class="content fade-in">
      <div class="titles">
        <div class="super-title-wrapper">
          <p class="super-title">Nettsider, Design og SEO</p>
          <p class="super-title bg">Nettsider, Design og SEO</p>
        </div>
        <h1 class="subtitle large">
          Øk din digitale tilstedeværelse, opplev vekst og oppnå dine mål med
          Moderna Media Digitalbyrå
        </h1>
      </div>
      <div class="buttons">
        <button class="btn cta primary" (click)="scrollToId('kontakt')">
          <p>Book et uforpliktet møte</p>
        </button>
        <button class="btn cta secondary" (click)="scrollToId('tjenester')">
          <p>Se våre tjenester</p>
        </button>
      </div>
      <div class="social-proof">
        <div class="avatars">
          <img
            src="../../../../assets/Images/testimonials/solaparkering/31fa76d5-35b6-468c-8c42-4291d6716f5e.webp"
            alt="Kunde"
          />
          <img
            src="../../../../assets/Images/testimonials/mamrot/patrikmamrot.jpg"
            alt="Kunde"
          />
          <img
            src="../../../../assets/Images/testimonials/fjerdingby/person_dana.jpg"
            alt="Kunde"
          />
        </div>
        <p class="proof-text"><strong>50+ bedrifter</strong> har valgt oss</p>
      </div>
    </div>
  </div>
</section>
