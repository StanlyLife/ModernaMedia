<section class="landing">
  <div class="wrapper">
    <div class="bg">
      <img
        class="landing-image"
        src="/assets/img/home/digitalbyra-oslo-hero-1280.webp"
        srcset="
          /assets/img/home/digitalbyra-oslo-hero-640.webp   640w,
          /assets/img/home/digitalbyra-oslo-hero-960.webp   960w,
          /assets/img/home/digitalbyra-oslo-hero-1280.webp 1280w,
          /assets/img/home/digitalbyra-oslo-hero-1920.webp 1920w
        "
        sizes="100vw"
        width="1280"
        height="853"
        fetchpriority="high"
        alt="Team fra Moderna Media som planlegger nettside, design og SEO for en bedrift"
      />
      <div class="bg-shade"></div>
    </div>
    <div class="content">
      <div class="titles">
        <div class="super-title-wrapper" data-text="Nettsider, Design og SEO">
          <p class="super-title">Nettsider, Design og SEO</p>
        </div>
        <h1 class="subtitle large">
          Moderna Media er et digitalbyrå i Oslo som lager nettsider, design og
          SEO som gir bedriften din vekst og flere kunder.
        </h1>
      </div>
      <div class="buttons">
        <a
          class="btn cta primary"
          href="#kontakt"
          (click)="scrollToId($event, 'kontakt')"
        >
          <p>Book et uforpliktende møte</p>
        </a>
        <a
          class="btn cta secondary"
          href="#tjenester"
          (click)="scrollToId($event, 'tjenester')"
        >
          <p>Se våre tjenester</p>
        </a>
      </div>
      <div class="social-proof">
        <div class="avatars">
          <img
            src="/assets/img/home/kunde-svein-magnar-96.webp"
            width="36"
            height="36"
            alt="Svein Magnar, daglig leder i Sola Parkering"
          />
          <img
            src="/assets/img/home/kunde-patrik-96.webp"
            width="36"
            height="36"
            alt="Patrik, daglig leder i Marbella Car Spa"
          />
          <img
            src="/assets/img/home/kunde-ena-96.webp"
            width="36"
            height="36"
            alt="Ena Hasanović, daglig leder i Fjerdingby Pizza & Grill"
          />
        </div>
        <p class="proof-text"><strong>50+ bedrifter</strong> har valgt oss</p>
      </div>
    </div>
  </div>
</section>
