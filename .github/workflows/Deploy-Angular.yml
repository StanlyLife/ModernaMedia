name: Angular Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ModernaMediaAngular

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ModernaMediaAngular/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --watch=false

      - name: Build SSR bundles
        run: npm run build:ssr

      - name: Set up SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          # tr strips Windows line endings in case the secret was pasted from a Windows shell.
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # The server's public host key, pinned so the deploy only ever talks to our server.
          echo "${{ secrets.HOST }} ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGGofxldLeqNATRTOH8A2md7QPUNV9bXZr9KHJS9vCXa" > ~/.ssh/known_hosts

      - name: Deploy to prod
        env:
          TARGET: ${{ secrets.HOST_NAME }}@${{ secrets.HOST }}
        run: |
          SSH="ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes"
          # Only changed files are copied and --delete drops old bundles, so the site never runs without files.
          rsync -az --delete -e "$SSH" dist/ "$TARGET:/var/www/ModernaMedia/Angular/dist/"
          $SSH "$TARGET" 'pm2 delete moderna-media || true; pm2 start /var/www/ModernaMedia/Angular/dist/ModernaMediaAngular/server/server.mjs --name moderna-media && pm2 save && systemctl reload nginx'

      - name: Check that the site answers
        run: curl -fsS -o /dev/null --retry 6 --retry-delay 5 --retry-all-errors https://modernamedia.no/

      - name: Notify search engines (IndexNow)
        continue-on-error: true
        run: node tools/indexnow.mjs
